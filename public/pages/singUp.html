<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastrar • Fluxar</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/styles/styleSingUp.css">
  <link rel="shortcut icon" href="/public/assets/icons/XFAVICOM 1.png" type="image/x-icon">
</head>

<body>
  <main>

    <section class="FluxarLogoSECTION">
      <div id="logo-container">
        <img src="/public/assets/icons/FluxarLogoBRANCA.png" alt="Logo do aplicativo fluxar" id="logoFluxarAPP">
      </div>
    </section>

    <section class="formSECTION">
      <a href="/public/index.html" style="margin-left: 550px;"><img src="/public/assets/icons/NeoTechLogo.png" alt="Voltar para a página inicial"></a>
      <div class="caixa">
        <div class="caixa__header">
          <div>
            <h1 class="caixa__title">Criar conta no Fluxar</h1>
            <div class="caixa__sub">Otimize seu estoque em poucos cliques</div>
          </div>
        </div>

        <form id="form">
          <fieldset>
            <legend>Cadastro</legend>
            <div class="form-grid">
              <div class="inputs">
                <input type="text" id="nome" name="nome" class="inputUser" placeholder=" " required />
                <label for="nome" class="labelinput">Nome Da Empresa</label>
              </div>
              <div class="inputs">
                <input type="email" id="email" name="email" class="inputUser" placeholder=" " required />
                <label for="email" class="labelinput">Email</label>
              </div>
              <div class="inputs">
                <input type="password" id="senha" name="senha" class="inputUser" placeholder=" " required />
                <label for="senha" class="labelinput">Senha</label>
              </div>
              <div class="inputs">
                <input type="tel" id="tel" name="tel" class="inputUser" placeholder=" " required />
                <label for="tel" class="labelinput">Telefone</label>
              </div>

              <button type="submit" id="submit">Cadastrar</button>
            </div>
          </fieldset>
          <div class="footer">
            Já tem conta? <a href="entrar.html">Entrar</a>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>

</html>
