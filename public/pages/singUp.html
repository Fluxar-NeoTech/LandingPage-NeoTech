<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cadastrar • Fluxar</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/public/styles/styleSingUp.css">
</head>
<body>

  <div id="logo-container">
    <img src="/assets/icons/FluxarLogoAPP.png" alt="Logo do aplicativo fluxar" id="logoFluxarAPP">
  </div>

  <div class="caixa">
    <div class="caixa__header">
      <div>
        <h1 class="caixa__title">Criar conta no Fluxar</h1>
        <div class="caixa__sub">Otimize seu estoque em poucos cliques</div>
      </div>
    </div>

    <form id="form">
      <fieldset>
        <legend>Cadastro</legend>
        <div class="form-grid">
          <div class="inputs">
            <input type="text" id="nome" name="nome" class="inputUser" placeholder=" " required/>
            <label for="nome" class="labelinput">Nome Completo</label>
          </div>
          <div class="inputs">
            <input type="email" id="email" name="email" class="inputUser" placeholder=" " required/>
            <label for="email" class="labelinput">Email</label>
          </div>
          <div class="inputs">
            <input type="password" id="senha" name="senha" class="inputUser" placeholder=" " required/>
            <label for="senha" class="labelinput">Senha</label>
          </div>
          <div class="inputs">
            <input type="tel" id="tel" name="tel" class="inputUser" placeholder=" " required/>
            <label for="tel" class="labelinput">Telefone</label>
          </div>

          <div>
            <p style="margin:6px 0;font-weight:600;color:var(--purple-800)">Sexo:</p>
            <div class="radio-group">
              <label><input type="radio" name="sexo" value="feminino" required/> Feminino</label>
              <label><input type="radio" name="sexo" value="masculino" required/> Masculino</label>
              <label><input type="radio" name="sexo" value="outro" required/> Outro</label>
            </div>
          </div>

          <button type="submit" id="submit">Cadastrar</button>
        </div>
      </fieldset>
      <div class="footer">
        Já tem conta? <a href="entrar.html">Entrar</a>
      </div>
    </form>
  </div>
</body>
</html>
