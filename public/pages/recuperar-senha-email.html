<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar senha • Fluxar</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/styles/styleSingUp.css">
    <link rel="shortcut icon" href="/public/assets/icons/XFAVICOM 1.png" type="image/x-icon">
</head>

<body>
    <main>

        <section class="FluxarLogoSECTION">
            <div id="logo-container">
                <img src="/public/assets/icons/FluxarLogoBRANCA.png" alt="Logo do aplicativo fluxar" id="logoFluxarAPP">
            </div>
        </section>

        <section class="formSECTION">
            <div class="caixa">
                <a href="/public/index.html">
                    <p style="font-weight: bold;">← Voltar para a página principal</p>
                </a>
                <div class="caixa__header">
                    <div>
                        <h1 class="caixa__title">Recuperar senha</h1>
                    </div>
                </div>

                <form id="form">
                    <fieldset>
                        <div class="form-grid">
                            <div class="inputs">
                                <input type="email" id="email" name="email" class="inputUser" placeholder=" "
                                    required />
                                <label for="email" class="labelinput">Email</label>
                            </div>
                            <button type="submit" id="submit">Enviar</button>
                        </div>
                    </fieldset>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
